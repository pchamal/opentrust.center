name: discover silent files
on:
  schedule: [{ cron: "17 3 * * 1" }]
  workflow_dispatch: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install httpx selectolax crawl4ai && python -m playwright install --with-deps chromium
      - run: python pipeline/discover.py --limit 300 --search --resume --learn --concurrency 8
        env: { INSFORGE_API_KEY: "${{ secrets.INSFORGE_API_KEY }}", INSFORGE_URL: "https://hm3jx7vv.us-east.insforge.app" }
      - run: python pipeline/export_verified.py && python build_pages.py
      - run: |
          git config user.name "discover bot"
          git config user.email "bot@opentrust.center"
          git add -A && git diff --cached --quiet || (git commit -m "sweep: $(date -u +%Y-%m-%d) discoveries filed" && git push)
